[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "snippysnappy"
dynamic = ["version"]
description = "A collection of Cnosu's code snippets. Basically a library."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [
    { name = "Cnosu", email = "cnosu.system@gmail.com" }
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.hatch.version]
path = "snippysnappy/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["snippysnappy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
